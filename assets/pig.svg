<?xml version="1.0" encoding="UTF-8"?>
<!--
    This simple cartoon pig illustration is entirely original.  It is drawn
    using basic SVG shapes to approximate the brand's mascot without
    reproducing any copyrighted artwork.  The pig smiles, winks and holds
    a bowl to echo the braised pork rice theme.  Colours reference the
    brand palette defined in the accompanying stylesheet.
-->
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- head -->
  <circle cx="100" cy="80" r="60" fill="#FFC0CB" stroke="#3b1f0a" stroke-width="4"/>
  <!-- ears -->
  <path d="M40 60 q20 -40 40 0" fill="#FFC0CB" stroke="#3b1f0a" stroke-width="4"/>
  <path d="M160 60 q-20 -40 -40 0" fill="#FFC0CB" stroke="#3b1f0a" stroke-width="4"/>
  <!-- bowl (hands form the rim) -->
  <path d="M40 110 q60 80 120 0 L160 110 q-20 40 -60 40 q-40 0 -60 -40z" fill="#E55B43" stroke="#3b1f0a" stroke-width="4"/>
  <!-- nose -->
  <ellipse cx="100" cy="100" rx="32" ry="22" fill="#FF8AAE" stroke="#3b1f0a" stroke-width="4"/>
  <ellipse cx="88" cy="100" rx="6" ry="8" fill="#3b1f0a"/>
  <ellipse cx="112" cy="100" rx="6" ry="8" fill="#3b1f0a"/>
  <!-- eyes: left open, right winking -->
  <circle cx="76" cy="68" r="8" fill="#3b1f0a"/>
  <path d="M118 68 q6 6 12 0" stroke="#3b1f0a" stroke-width="4" fill="none"/>
  <!-- cheeks -->
  <circle cx="60" cy="95" r="10" fill="#FFA7C4" opacity="0.7"/>
  <circle cx="140" cy="95" r="10" fill="#FFA7C4" opacity="0.7"/>
  <!-- smile -->
  <path d="M75 120 q25 20 50 0" fill="none" stroke="#3b1f0a" stroke-width="4" stroke-linecap="round"/>
</svg>